<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquibancada FC - Login</title>
    <style>
        :root {
            --bg-color: #F0F0F0;
            --text-color: #000;
            --card-bg: #FFF;
            --input-bg: #FFF;
            --input-shadow: rgb(204, 219, 232) 3px 3px 6px 0px inset, rgba(255, 255, 255, 0.5) -3px -3px 6px 1px inset;
        }

        .dark-mode {
            --bg-color: #121212;
            --text-color: #FFF;
            --card-bg: #1e1e1e;
            --input-bg: #333;
            --input-shadow: rgb(21, 21, 22) 3px 3px 6px 0px inset, rgba(36, 32, 32, 0.5) -3px -3px 6px 1px inset;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .topo-botoes {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .botaoTema, .botaoAjuda {
            border: none;
            cursor: pointer;
        }

        .botaoTema {
            background: transparent;
        }

        .botaoTema img {
            width: 40px;
        }

        .botaoAjuda {
            border-radius: 20px;
            width: 90px;
            height: 40px;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }

        .container-principal {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 8%;
            border-radius: 20px;
            box-shadow: rgba(0, 0, 0, 0.3) 0px 15px 40px;
            overflow: hidden;
        }

        .mosaico {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.6s ease-in-out;
            z-index: 1;
        }

        .mascara-escura {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.1) 100%);
            z-index: 2;
        }

        .login {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 280px;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: rgba(0, 0, 0, 0.4) 0px 10px 30px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container-principal {
                justify-content: center;
                padding-left: 0;
            }
            .mascara-escura {
                background: rgba(0,0,0,0.4);
            }
        }

        .entrada {
            width: 90%;
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 15px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: none;
            box-shadow: var(--input-shadow);
            outline: none;
        }

        .botoes-form {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .botaoEntrar, .botaoCriar {
            border: none;
            border-radius: 20px;
            cursor: pointer;
            height: 45px;
            font-weight: bold;
            transition: transform 0.2s;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
        }

        .botaoEntrar { width: 45%; background-color: #4FB32B; color: white; }
        .botaoCriar { width: 50%; background-color: var(--bg-color); color: var(--text-color); }

        .botaoEntrar:hover { background-color: #469E26; transform: scale(1.05); }
        .botaoCriar:hover, .botaoAjuda:hover { transform: scale(1.05); }
        .login a { color: var(--text-color); text-decoration: none; display: block; margin-top: 20px; font-size: 14px;}
        .login a:hover { text-decoration: underline; }

    </style>
</head>
<body>
    <div class="topo-botoes">
        <button class="botaoAjuda">Ajuda</button>
        <button onclick="alternarTema()" class="botaoTema">
            <img id="iconeTema" src="TemaEscuro.png" alt="Mudar Tema">
        </button>
    </div>

    <div class="container-principal">
        <div class="mosaico" id="Mosaico"></div>
        <div class="mascara-escura"></div>
        
        <div class="login">
            <img id="logoSite" src="4.png" width="40" alt="Logo">
            <h5 style="margin-top: 5px; color: gray;">Arquibancada futebol community</h5>
            <h2>Fazer login</h2>
            
<form id="formLogin" onsubmit="fazerLogin(event)">
    <p style="text-align: left; margin: 5px 15px;">Email:</p>
    <input type="email" id="emailLogin" class="entrada" required>
    
    <p style="text-align: left; margin: 5px 15px;">Senha:</p>
    <input type="password" id="senhaLogin" class="entrada" required>
    
    <div class="botoes-form">
        <button type="button" class="botaoCriar" onclick="criarConta()">Criar conta</button>
        <button type="submit" class="botaoEntrar">Entrar</button> 
    </div>
    <a href="#">Esqueceu sua senha?</a>
</form>
        </div>
    </div>

    <script>
        const imagens = ["Torcida1.jpg", "Torcida2.jpg", "Torcida3.jpg", "Torcida4.jpg", "Torcida5.jpg"];
        
        function fazerLogin(event) 
        {
            event.preventDefault(); 
            const emailDigitado = document.getElementById('emailLogin').value;
            const senhaDigitada = document.getElementById('senhaLogin').value;
            const dadosLogin = {
            email: emailDigitado,
            senha: senhaDigitada
        };

    fetch('login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dadosLogin)
    })
    .then(async response => {
        if (response.ok) {
            const usuarioLogado = await response.json();
            localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));
            
            window.location.href = 'app.html';
        } else {
            const mensagemErro = await response.text();
            alert("Falha no login: " + mensagemErro);
        }
    })
    .catch(error => {
        console.error("Erro de conexão:", error);
        alert("Erro ao conectar com o servidor.");
    });
}
        function trocarImagem() {
            const numero = Math.floor(Math.random() * imagens.length);
            const banner = document.getElementById("Mosaico");
            if (!banner) return;
            
            banner.style.opacity = 0;
            
            setTimeout(() => {
                banner.style.backgroundImage = `url(${imagens[numero]})`;
                banner.style.opacity = 1;
            }, 600);
        }
        setInterval(trocarImagem, 10000);

        function alternarTema() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            
            const icone = document.getElementById("iconeTema");
            if (icone) icone.src = isDark ? "TemaClaro.png" : "TemaEscuro.png";

            const logo = document.getElementById("logoSite");
            if (logo) logo.src = isDark ? "4Claro.png" : "4.png";

            localStorage.setItem("tema", isDark ? "dark" : "light");
        }

        window.onload = function () {
            trocarImagem();
            
            if (localStorage.getItem("tema") === "dark") {
                document.body.classList.add("dark-mode");
                
                const icone = document.getElementById("iconeTema");
                if (icone) icone.src = "TemaClaro.png";
                
                const logo = document.getElementById("logoSite");
                if (logo) logo.src = "4Claro.png";
            }
        }
    function criarConta() {
    const emailDigitado = document.getElementById('emailLogin').value;
    const senhaDigitada = document.getElementById('senhaLogin').value;

    if (!emailDigitado || !senhaDigitada) {
        alert("Preencha e-mail e senha para criar a conta!");
        return;
    }
    const dadosUsuario = {
        email: emailDigitado,
        senha: senhaDigitada
    };
    fetch('cadastrar.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(dadosUsuario)
    })
    .then(async response => {
        const mensagem = await response.text();
        if (response.ok) {
            alert("Sucesso: " + mensagem + "\nAgora você já pode fazer login!");
            
            document.getElementById('emailLogin').value = '';
            document.getElementById('senhaLogin').value = '';
        } else {
            alert("Falha: " + mensagem); 
        }
    })
    .catch(error => {
        console.error("Erro de conexão:", error);
        alert("Erro ao conectar com o servidor. Verifique se o backend Java está rodando.");
    });
}
    </script>
</body>
</html>
